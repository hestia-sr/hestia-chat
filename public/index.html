<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hestia Chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="topbar">
    <button id="btn-menu" class="icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    </button>
    <select id="model-picker" aria-label="Pilih model"><option value="">Memuat model…</option></select>
    <button id="btn-new" class="icon-btn" aria-label="Chat baru">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </header>

  <!-- Sidebar -->
  <div id="drawer-backdrop" hidden></div>
  <aside id="drawer" aria-label="Riwayat dan pengaturan">
    <div class="drawer-head">
      <span class="brand">Hestia Chat</span>
      <button id="btn-close-drawer" class="icon-btn" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button id="btn-new-2" class="pill-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Chat baru
    </button>
    <div class="drawer-section">Riwayat</div>
    <div id="chat-list"></div>
    <div class="drawer-section">Lainnya</div>
    <button id="btn-settings" class="drawer-item">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Pengaturan
    </button>
    <button id="btn-clear" class="drawer-item danger">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Hapus semua riwayat
    </button>
  </aside>

  <!-- Chat area -->
  <main id="chat-area">
    <div id="messages"></div>
    <div id="empty-state">
      <div class="empty-logo">H</div>
      <h1>Hestia Chat</h1>
      <p>Chat AI ringan — tersambung ke Hestia Bridge.<br>Isi API key di Pengaturan untuk mulai.</p>
      <button id="btn-open-settings" class="accent-btn">Buka Pengaturan</button>
    </div>
  </main>

  <!-- Composer -->
  <footer id="composer" hidden>
    <textarea id="input" rows="1" placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)"></textarea>
    <button id="btn-send" class="send-btn" aria-label="Kirim">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </footer>
</div>

<!-- Settings modal -->
<div id="settings-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h2>Pengaturan</h2>
      <button id="btn-close-settings" class="icon-btn" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <label>Bridge Base URL
      <input id="set-baseurl" type="url" placeholder="https://hestia-bridge-production.up.railway.app/v1">
    </label>
    <label>API Key (dari Hestia Bridge)
      <input id="set-key" type="password" placeholder="hb-…" autocomplete="off">
    </label>
    <label>System prompt (opsional)
      <textarea id="set-system" rows="3" placeholder="Contoh: Kamu asisten yang ramah…"></textarea>
    </label>
    <div id="settings-status" class="status" hidden></div>
    <div class="modal-actions">
      <button id="btn-test" class="ghost-btn">Test koneksi</button>
      <button id="btn-save-settings" class="accent-btn">Simpan</button>
    </div>
    <p class="hint">Ambil API key dari dashboard Hestia Bridge → + Tambah key → salin key hb-…</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
